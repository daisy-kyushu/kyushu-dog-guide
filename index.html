<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daisy's Kyushu Guide</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <h1>Daisy's Kyushu Guide</h1>
        <p class="sub">犬連れで行ける九州のおでかけ情報</p>
        <p id="lastUpdated" class="updated">最終更新: -</p>
      </header>

      <section class="filters">
        <input id="q" placeholder="キーワードで検索" />
        <select id="pref"></select>
        <select id="cat"></select>
        <select id="season">
          <option value="すべて">季節: すべて</option>
          <option value="春">春</option>
          <option value="夏">夏</option>
          <option value="秋">秋</option>
          <option value="冬">冬</option>
        </select>
        <label class="dog-toggle"><input type="checkbox" id="largeDog" /> 大型犬向けを優先</label>
      </section>

      <div id="quick" class="quick"></div>
      <p id="count" class="sub"></p>
      <section id="featured" class="featured"></section>
      <section id="list" class="grid"></section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>l>
