name: Collect event candidates

on:
  schedule:
    - cron: '0 21 * * *' # 毎日 UTC 21:00（JST 06:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure data file exists
        run: |
          mkdir -p data
          if [ ! -f data/events.json ]; then
            echo "[]" > data/events.json
          fi

      - name: Collect candidate events
        run: python scripts/fetch_events.py

      - name: Detect changes
        id: changes
        run: |
          git add data/events.json
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updates if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update event candidates"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Count pending items
        id: pending
        run: |
          PENDING_COUNT=$(python - <<'PY'
import json
from pathlib import Path

p = Path("data/events.json")
if not p.exists():
    print(0)
    raise SystemExit

try:
    events = json.loads(p.read_text(encoding="utf-8"))
except Exception:
    print(0)
    raise SystemExit

print(sum(1 for e in events if e.get("status") == "要確認"))
PY
)
          echo "count=${PENDING_COUNT}" >> $GITHUB_OUTPUT
          echo "pending_count=${PENDING_COUNT}"

      - name: Notify LINE when pending exists (broadcast)
        if: steps.pending.outputs.count != '0'
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          PENDING_COUNT: ${{ steps.pending.outputs.count }}
        run: |
          if [ -z "${LINE_TOKEN}" ]; then
            echo "LINE_CHANNEL_ACCESS_TOKEN is not set. Skip notification."
            exit 0
          fi

          MSG="要確認の候補が ${PENDING_COUNT} 件あります。スマホで確認してください。"

          PAYLOAD=$(cat <<EOF
{
  "messages": [
    {
      "type": "text",
      "text": "${MSG}"
    }
  ]
}
EOF
)

          curl -sS -X POST "https://api.line.me/v2/bot/message/broadcast" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${LINE_TOKEN}" \
            -d "${PAYLOAD}"
