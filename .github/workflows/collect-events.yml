name: Collect event candidates

on:
  schedule:
    - cron: "0 21 * * *" # 毎日 UTC 21:00（JST 06:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure data files exist
        run: |
          mkdir -p data
          [ -f data/events.json ] || echo "[]" > data/events.json
          [ -f data/instagram-sources.json ] || echo '{"hashtags":[]}' > data/instagram-sources.json

      - name: Collect candidate events
        run: python scripts/fetch_events.py

      - name: Detect changes
        id: changes
        run: |
          git add data/events.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updates if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update event candidates"
          git pull --rebase origin main
          git push origin HEAD:main
　　　- name: LINE test ping
  env:
    LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
  run: |
    if [ -z "${LINE_TOKEN}" ]; then
      echo "LINE token missing"
      exit 1
    fi
    curl -sS -X POST "https://api.line.me/v2/bot/message/broadcast" \
      -H "Content-Type: application/json" \
      -H "Authorization: Bearer ${LINE_TOKEN}" \
      -d '{"messages":[{"type":"text","text":"テスト通知: Collect workflowから送信"}]}'
